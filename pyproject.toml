[project]
name = "neural-steering"
version = "0.0.1-alpha0"
description = "Package for activation space interventions in neural networks"
authors = [
    {name = "Mateusz", email = "mateusz.piotrowski94@gmail.com"},
]
dependencies = [
    "transformer-lens",
    "torch>=2.8.0",
    "tqdm",
    "datasets>=3.1.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.5.0",
]

[tool.pdm]
distribution = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
